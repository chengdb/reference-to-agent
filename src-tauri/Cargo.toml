[package]
name = "reference-to-agent"
version = "0.1.0"
description = "一键把 IDE 选中的代码/文件路径发送到 AI agent 聊天"
authors = ["fengy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 桌面端仅需 rlib；cdylib/staticlib 用于移动端打包，在 Windows GNU 环境下会触发
# "export ordinal too large" 链接错误，故省略。
name = "reference_to_agent_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
enigo = "0.2.0"
arboard = "3"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

